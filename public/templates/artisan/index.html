<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Craft | E-commerce Template</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div className="top-bar">Free shipping on orders over ₹1,000</div>
        <nav>
            <div className="logo">Artisan<span>Craft</span></div>
            <div className="menu">
                <a href="#">Soaps</a>
                <a href="#">Candles</a>
                <a href="#">Gifts</a>
                <a href="#" className="cart-link">🛒 <span className="badge">0</span></a>
            </div>
        </nav>
    </header>

    <section className="hero">
        <div className="hero-content">
            <h2>Handmade with heart</h2>
            <p>Experience the purity of nature in every drop and lather.</p>
            <button className="shop-btn">Explore Collection</button>
        </div>
    </section>

    <section className="featured">
        <h3>New Arrivals</h3>
        <div className="grid">
            <div className="card">
                <div className="img-placeholder"></div>
                <h4>Organic Honey & Oat</h4>
                <p>₹350</p>
                <button>Add to Cart</button>
            </div>
            <div className="card">
                <div className="img-placeholder"></div>
                <h4>Lavender Dreams</h4>
                <p>₹299</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <footer>
        <div className="footer-content">
            <p>&copy; 2026 Artisan Craft. Handmade in India.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
