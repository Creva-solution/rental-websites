<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Commerce | E-commerce Template</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div className="brand">BOLD<span>STORE</span></div>
            <div className="nav-right">
                <input type="text" placeholder="Search..." />
                <div className="cart-icon">🛒 <span id="cart-count">0</span></div>
            </div>
        </nav>
    </header>

    <section className="banner">
        <div className="overlay">
            <h1>NEW SEASON<br><span>50% OFF</span></h1>
            <p>Don't just follow trends. Set them.</p>
            <button>SHOP THE DROP</button>
        </div>
    </section>

    <section className="categories">
        <div className="cat-card">FOOTWEAR</div>
        <div className="cat-card">APPAREL</div>
        <div className="cat-card">ACCESSORIES</div>
    </section>

    <section className="trending">
        <h2>TRENDING NOW</h2>
        <div className="product-container">
            <div className="p-card">
                <div className="img-box">HOT</div>
                <h4>Street Hoodie</h4>
                <p>₹2,499</p>
                <button className="add-btn">QUICK ADD</button>
            </div>
            <div className="p-card">
                <div className="img-box">NEW</div>
                <h4>Cargo Joggers</h4>
                <p>₹1,899</p>
                <button className="add-btn">QUICK ADD</button>
            </div>
        </div>
    </section>

    <footer>
        <div className="f-grid">
            <div>
                <h5>BOLDSTORE</h5>
                <p>High quality streetwear since 2026.</p>
            </div>
            <div>
                <h5>CONTACT</h5>
                <p>support@boldstore.com</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
