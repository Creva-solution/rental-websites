<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Elegance | E-commerce Template</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div className="logo">MINIMAL</div>
            <ul>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Collections</a></li>
                <li><a href="#">About</a></li>
            </ul>
            <div className="cart">Cart (0)</div>
        </nav>
    </header>

    <main>
        <section className="hero">
            <h1>Refined Aesthetics</h1>
            <p>Curated essentials for the modern lifestyle.</p>
            <a href="#" className="cta">Discover More</a>
        </section>

        <section className="products">
            <div className="product-grid">
                <div className="product-card">
                    <div className="product-image"></div>
                    <h3>White Ceramic Vase</h3>
                    <p className="price">₹1,299</p>
                </div>
                <div className="product-card">
                    <div className="product-image"></div>
                    <h3>Linen Bed Set</h3>
                    <p className="price">₹4,500</p>
                </div>
                <div className="product-card">
                    <div className="product-image"></div>
                    <h3>Oak Wood Lamp</h3>
                    <p className="price">₹2,100</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Minimal Elegance. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
